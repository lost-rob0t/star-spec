name: Update generated spec

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: Four-part release branch to update
        required: true
        default: 0.9.1.2

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release branch
        env:
          TARGET_BRANCH: ${{ inputs.release_branch }}
        run: |
          [[ "$TARGET_BRANCH" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lock, regenerate, and verify
        run: |
          python3 -m pip install --requirement requirements-dev.txt
          python3 tools/spec_pipeline.py lock
          make generate check test
          git diff --check
      - name: Commit reproducible projections
        env:
          TARGET_BRANCH: ${{ inputs.release_branch }}
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spec/release.lock.json generated/
          git commit -m "chore(spec): regenerate ${TARGET_BRANCH}"
          git push origin "HEAD:${TARGET_BRANCH}"

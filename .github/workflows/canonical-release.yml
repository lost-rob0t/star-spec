name: StarLang generated release
on: [pull_request, push]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python3 scripts/sync-starintel-schema.py
      - run: python3 -m unittest discover -s tests -v
